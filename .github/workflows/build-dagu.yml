name: Build dagu MIUI kernel (SukiSU Nova)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备代号 (defconfig 前缀)"
        required: false
        default: "dagu"
      ksu:
        description: "集成 SukiSU Nova (true/false)"
        required: false
        default: "true"
      susfs:
        description: "启用 SUSFS (true/false)"
        required: false
        default: "true"
      kpm:
        description: "启用 KPM + Image patch (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup proton-clang
        run: |
          mkdir -p "$HOME/proton-clang"
          cd "$HOME/proton-clang"
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q 20210522.zip

      - name: Build MIUI kernel
        env:
          TARGET_DEVICE: ${{ github.event.inputs.device || 'dagu' }}
          KSU_ENABLE: ${{ github.event.inputs.ksu || 'true' }}
          SUSFS_ENABLE: ${{ github.event.inputs.susfs || 'true' }}
          KPM_ENABLE: ${{ github.event.inputs.kpm || 'true' }}
          VARIANT: ${{ github.event.inputs.ksu == 'false' && '_base' || '_ksu' }}${{ github.event.inputs.susfs == 'false' && '_nosusfs' || '' }}${{ github.event.inputs.kpm == 'false' && '_nokpm' || '' }}
        run: |
          chmod +x ci/build_miui_nova.sh
          bash ci/build_miui_nova.sh

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: dagu-miui-sukisu-nova
          path: "*.zip"
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dagu-nova-ksu${{ github.event.inputs.ksu }}-kpm${{ github.event.inputs.kpm }}-susfs${{ github.event.inputs.susfs }}-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" *.zip \
            --title "dagu MIUI kernel (SukiSU Nova) $TAG" \
            --notes "Xiaomi Pad 5 Pro 12.4 (dagu) MIUI/HyperOS 内核，SukiSU Nova + SUSFS + KPM。刷入前请确认 ROM 为 MIUI/HyperOS，AOSP 会黑屏。"
